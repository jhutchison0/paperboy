# ============================================================
# Research Podcast Pipeline — Configuration
# ============================================================
# Edit this file to customize your daily research briefings.
# API keys should go in a .env file, not here.
# ============================================================

pipeline:
  output_dir: "./output/briefings"
  max_papers_to_fetch: 50
  max_papers_to_score: 20
  days_lookback: 7
  log_level: "INFO"

arxiv:
  categories:
    - "cs.AI"     # Artificial Intelligence
    - "cs.LG"     # Machine Learning
    - "cs.CL"     # Computation and Language (NLP)
    - "stat.ML"   # Statistics — Machine Learning
  max_results_per_category: 25
  sort_by: "submittedDate"
  rate_limit_seconds: 3

blogs:
  feeds:
    - name: "Anthropic Research"
      url: "https://www.anthropic.com/research/feed.xml"
      category: "ai-labs"
    - name: "Google Research Blog"
      url: "http://feeds.feedburner.com/blogspot/gJZg"
      category: "ai-labs"
    - name: "OpenAI Blog"
      url: "https://openai.com/blog/rss.xml"
      category: "ai-labs"
    - name: "Lilian Weng"
      url: "https://lilianweng.github.io/index.xml"
      category: "ml-blog"
    - name: "The Gradient"
      url: "https://thegradient.pub/rss/"
      category: "ml-blog"
    - name: "Distill.pub"
      url: "https://distill.pub/rss.xml"
      category: "ml-blog"
  timeout_seconds: 15

# ============================================================
# Focus areas — what matters to YOU
# Edit these to match your current research interests.
# ============================================================
focus_areas:
  primary:
    - "LLMs for decision support"
    - "Knowledge graphs and reasoning"
    - "Deep learning interpretability"
    - "Generative AI architecture and scaling"
    - "Behavioral decision science"
    - "Statistical foundations of machine learning"
    - "Retrieval-augmented generation"
    - "AI agents and tool use"
  keywords:
    - "large language model"
    - "llm"
    - "transformer"
    - "knowledge graph"
    - "decision making"
    - "decision support"
    - "generative model"
    - "retrieval augmented"
    - "rag"
    - "chain of thought"
    - "reasoning"
    - "interpretability"
    - "explainability"
    - "agent"
    - "tool use"
    - "fine-tuning"
    - "reinforcement learning"
    - "neural network"
    - "deep learning"
    - "bayesian"
    - "causal inference"
    - "graph neural network"
    - "attention mechanism"
    - "prompt engineering"
    - "multimodal"

# ============================================================
# Claude API settings for selection scoring and distillation
# ============================================================
claude:
  model: "claude-sonnet-4-20250514"
  scoring_model: "claude-haiku-4-5-20251001"  # Cheaper model for paper scoring
  max_tokens: 8000
  temperature: 0.7

# ============================================================
# Selector settings
# ============================================================
selector:
  use_claude_scoring: true
  keyword_weight: 0.4
  claude_weight: 0.6
  min_score_threshold: 0.3
  top_k_for_claude: 5  # Only Claude-score the top 5 keyword matches

# ============================================================
# Agent Runner settings (Claude Code CLI backend)
# Used when ANTHROPIC_API_KEY is not available.
# ============================================================
agent_runner:
  enabled: true
  score_timeout: 30       # seconds per scoring invocation
  distill_timeout: 120    # seconds for briefing generation
  max_retries: 1
  max_output_bytes: 51200 # 50KB output cap
  batch_size: 1           # papers per scoring invocation (target: 5)

# ============================================================
# Distiller settings
# ============================================================
distiller:
  target_word_count: 4500
  style: "3blue1brown"
  include_challenger_sections: true
  user_context: >
    The reader is a research scientist
    who is building expertise in generative AI for decision support.
    They work with LLMs as tools for structured reasoning,
    knowledge graphs, and deep learning.
    Connect research to practical applications.
